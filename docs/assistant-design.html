<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Experiment planner · Flykeeper</title>
  <style>
    :root{color-scheme:light;--ink:#203c35;--muted:#697a73;--line:#dce5de;--paper:#fff;--wash:#f5f7f3;--green:#245b49;--pale:#e9f0e8;--amber:#8a5b20;--amber-bg:#fcf5e9;--red:#a24538;--radius:8px;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--wash)}
    *{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.45}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea,summary{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--green)}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;background:white;min-height:36px;padding:7px 12px;font-weight:600}button:hover{background:var(--pale)}button:disabled{cursor:not-allowed;opacity:.48}button.primary{color:white;background:var(--green);border-color:var(--green)}button.primary:hover{background:#194735}button.quiet{background:transparent;border-color:transparent}button.icon{width:32px;min-height:30px;padding:3px;font-size:17px}button.danger{color:var(--red)}input,select,textarea{width:100%;border:1px solid #cbd7ce;border-radius:5px;background:white;padding:9px 10px;min-height:39px}input::placeholder,textarea::placeholder{color:#87928c}input[type=checkbox]{width:16px;min-height:auto;margin:0;accent-color:var(--green)}textarea{resize:vertical}label{display:block;font-size:12px;font-weight:600;color:#52665c}label input,label select,label textarea{margin-top:6px;font-weight:400;font-size:14px}h1,h2,h3,p{margin:0}h2{font-size:17px;font-weight:650}h3{font-size:14px}a{color:var(--green);text-decoration:none}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--pale);padding:4px 9px;border-radius:4px;font-weight:500}.badge.amber{color:var(--amber);background:var(--amber-bg)}.badge.neutral{background:#eef1ee;color:var(--muted)}.dot{width:6px;height:6px;background:#89968c;border-radius:50%}[hidden]{display:none!important}
    .appbar{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:50px;padding:0 34px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:-.5px;font-weight:700}.brandmark{width:27px;height:27px;border-radius:50% 50% 40% 40%;background:var(--green);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:500}.current-area{height:66px;display:flex;align-items:center;border-bottom:2px solid var(--green);font-weight:600}.appbar .timezone{margin-left:auto;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;max-width:1680px;margin:auto;min-height:calc(100vh - 66px)}.layout.assistant-hidden{grid-template-columns:1fr}.canvas{padding:27px 38px 60px;min-width:0}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:15px}.header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:25px}.heading{display:flex;align-items:center;gap:13px}.title{font-size:28px;letter-spacing:-.8px;min-width:0;max-width:470px;background:transparent;border:1px solid transparent;padding:0;min-height:41px;font-weight:600}.title:hover,.title:focus{border-color:var(--line);background:white}.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.section{margin-bottom:25px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:12px}.target{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px}.target-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:14px}.target-extra{display:grid;grid-template-columns:1.6fr .75fr 1.2fr;gap:14px;margin-top:15px;align-items:end}.check{display:flex;gap:8px;align-items:center;font-size:12px;min-height:39px}.material-grid{display:grid;grid-template-columns:minmax(180px,1.5fr) 1fr .7fr;gap:13px;align-items:start}.materials{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}.material-detail{margin-top:11px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap}.source-warning{color:var(--amber)}.step-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;padding:19px 0 20px;border-bottom:1px solid var(--line)}.step-number{border:1px solid #cbd8cd;background:var(--wash);font-size:12px;border-radius:50%;height:25px;width:25px;display:grid;place-items:center;margin-top:4px;color:var(--muted)}.step-top{display:flex;gap:10px;align-items:center;margin-bottom:11px}.step-title{border:1px solid transparent;background:transparent;padding:2px 0;font-size:15px;font-weight:600;min-height:30px}.step-title:hover,.step-title:focus{border-color:var(--line);background:#fff;padding-left:5px}.step-buttons{display:flex;flex-shrink:0;gap:2px}.step-fields{display:grid;grid-template-columns:1.15fr .8fr .8fr;gap:12px}.step-field-wide{grid-column:1/-1}.step-status{margin-top:10px;font-size:12px;color:var(--muted)}.step-status.needs{color:var(--amber)}.step-status.conflict{color:var(--red)}.step-anchor{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:12px;color:var(--muted)}.day-offset{width:66px;min-height:30px;padding:4px 7px}.step-note{margin-top:10px}.step-note label{font-weight:400}.step-note textarea{min-height:60px}.steps-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}.summary{font-size:12px;color:var(--muted)}.result{margin-top:12px;padding:10px 12px;border-left:3px solid var(--green);background:var(--pale);font-size:13px}.result.amber{border-color:#b48a48;background:var(--amber-bg);color:var(--amber)}
    .assistant{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 66px);min-height:580px}.assistant-head{padding:24px 23px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.assistant-context{padding:17px 23px;border-bottom:1px solid var(--line)}.context-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}.context-title{font-size:14px;font-weight:600;overflow-wrap:anywhere}.context-date{font-size:12px;color:var(--muted);margin-top:5px}.connection-row{padding:16px 23px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.connection-state{display:flex;align-items:center;gap:7px}.assistant-empty{flex:1;min-height:90px}.composer{padding:19px 20px 22px;border-top:1px solid var(--line)}.composer textarea{border:none;padding:0;min-height:86px;resize:none}.composer textarea:disabled{background:#fff;opacity:.65}.composer-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px;font-size:11px;color:var(--muted)}.composer button{min-width:65px}.dialog{width:min(520px,calc(100vw - 34px));border:1px solid var(--line);border-radius:10px;padding:25px;box-shadow:0 15px 70px #183c3528}.dialog::backdrop{background:#17382d4d}.dialog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dialog-grid{display:grid;gap:16px}.dialog-actions{margin-top:23px;display:flex;justify-content:flex-end;gap:8px}.dialog-status{font-size:12px;color:var(--muted);margin-top:16px}.availability-note{margin-top:9px;color:var(--amber);font-size:12px}.live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    input[aria-invalid=true]{border-color:#b17a3f}
    @media(min-width:1450px){.canvas{padding:32px 62px 65px}.layout{grid-template-columns:minmax(0,1fr) 360px}.target-grid{gap:18px}.step-fields{grid-template-columns:1.2fr .85fr .85fr}}
    @media(max-width:1120px){.layout{grid-template-columns:minmax(0,1fr) 290px}.canvas{padding:24px}.header{display:block}.header-actions{justify-content:flex-start;margin-top:12px}.target-grid{grid-template-columns:1fr 1fr}.target-extra{grid-template-columns:1fr 1fr}.check{grid-column:1/-1}.material-grid{grid-template-columns:1fr 1fr}.material-grid label:first-child{grid-column:1/-1}.assistant-head,.assistant-context,.connection-row{padding-left:18px;padding-right:18px}.step-fields{grid-template-columns:1fr 1fr}.step-fields label:first-child{grid-column:1/-1}}
    @media(max-width:800px){.appbar{padding:0 20px;gap:25px}.timezone{display:none}.layout{display:block}.canvas{padding:23px 20px 45px}.assistant{position:fixed;right:0;top:0;width:min(360px,100%);height:100vh;z-index:10;box-shadow:-14px 0 45px #17382d25;min-height:0}.title{font-size:26px}.heading{gap:8px}.target{padding:16px}.step-top{gap:3px}.step-buttons{gap:0}.step-title{font-size:14px}.step-buttons button{width:27px}.step{grid-template-columns:25px minmax(0,1fr);gap:8px}.steps-footer{align-items:flex-start}.material-grid{gap:12px}}
    @media(max-width:420px){.canvas{padding:20px 14px 40px}.appbar{padding:0 15px;gap:20px}.brand{font-size:17px}.target-extra{grid-template-columns:1fr}.check{grid-column:auto}.heading{flex-wrap:wrap}.title{width:100%}.step-fields{gap:10px}.step-top{flex-wrap:wrap}.step-title{flex:1;min-width:130px}.step-buttons{margin-left:auto}}
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="brandmark" aria-hidden="true">f</span>Flykeeper</div>
    <div class="current-area">Experiments</div>
    <span class="timezone">Asia / Shanghai</span>
  </header>
  <div class="layout" id="layout">
    <main class="canvas">
      <p class="breadcrumb">Experiments / New experiment</p>
      <div class="header">
        <div class="heading"><input class="title" id="experiment-title" aria-label="Experiment name" value="L1 dissection" maxlength="120"><span class="badge neutral">Draft</span></div>
        <div class="header-actions"><button id="assistant-toggle" aria-controls="assistant" aria-expanded="true">Assistant</button><button class="primary" id="check-draft">Check draft</button></div>
      </div>

      <section class="section target" aria-labelledby="target-heading">
        <div class="section-heading"><h2 id="target-heading">Target</h2></div>
        <div class="target-grid">
          <label>Operation<select id="operation"><option value="l1">L1 dissection</option><option value="l3">L3 dissection</option></select></label>
          <label>Date<input id="target-date" type="date" value="2026-09-28" required></label>
          <label>Start<input id="target-start" type="time" value="10:00" required></label>
          <label>End<input id="target-end" type="time" value="12:00" required></label>
        </div>
        <div class="target-extra">
          <label>Target genotype<input id="target-genotype" value="w1118" placeholder="Genotype" maxlength="250"></label>
          <label>Larvae needed<input id="target-quantity" type="number" min="1" max="100000" placeholder="Quantity"></label>
          <label class="check"><input id="weekdays-only" type="checkbox" checked>Weekday operations</label>
        </div>
        <p id="target-warning" class="availability-note" role="status" hidden></p>
      </section>

      <section class="section" aria-labelledby="materials-heading">
        <div class="section-heading"><h2 id="materials-heading">Materials</h2></div>
        <div class="materials">
          <div class="material-grid">
            <label>Source<select id="source"><option value="bottle-a">Example bottle A · w1118</option><option value="vial-b">Example vial B · elav-GAL4</option><option value="unassigned">Unassigned</option></select></label>
            <label id="adult-source-label">Adults<select id="adult-source"><option value="parents">Parents</option><option value="offspring">Offspring</option></select></label>
            <label id="adult-count-label">Adults selected<input id="adult-count" type="number" min="1" max="100000" placeholder="Unknown"></label>
            <label id="l3-material-label" hidden>Culture<select id="l3-material"><option value="new">New culture</option><option value="existing">Use source culture</option></select></label>
          </div>
          <div class="material-detail"><span id="source-detail"></span><span id="source-warning" class="source-warning"></span></div>
        </div>
      </section>

      <section class="section" aria-labelledby="steps-heading">
        <div class="section-heading"><h2 id="steps-heading">Steps</h2><span class="badge amber" id="draft-state">Needs inputs</span></div>
        <ol class="step-list" id="steps"></ol>
        <div class="steps-footer"><button id="add-step">+ Add step</button><p class="summary" id="step-summary"></p></div>
        <p class="result" id="check-result" role="status" hidden></p>
      </section>
    </main>

    <aside class="assistant" id="assistant" aria-labelledby="assistant-heading">
      <div class="assistant-head"><h2 id="assistant-heading">Assistant</h2><button class="icon quiet" id="assistant-close" aria-label="Close assistant">×</button></div>
      <div class="assistant-context"><div class="context-label">Current experiment</div><div class="context-title" id="context-title">L1 dissection</div><div class="context-date" id="context-date"></div></div>
      <div class="connection-row"><span class="connection-state"><span class="dot" aria-hidden="true"></span>Disconnected</span><button id="connection-open" class="quiet">Connection</button></div>
      <div class="assistant-empty"></div>
      <div class="composer"><label for="assistant-prompt" class="live">Message assistant</label><textarea id="assistant-prompt" placeholder="Ask about this experiment" disabled></textarea><div class="composer-footer"><span id="profile-caption">No model selected</span><button class="primary" id="send-prompt" disabled>Send</button></div></div>
    </aside>
  </div>

  <dialog class="dialog" id="connection-dialog" aria-labelledby="connection-heading">
    <form id="connection-form">
      <div class="dialog-header"><h2 id="connection-heading">Connection</h2><button class="icon quiet" type="button" id="connection-close" aria-label="Close connection settings">×</button></div>
      <div class="dialog-grid">
        <label>Profile<select id="profile-kind"><option value="cloud">Cloud API</option><option value="local">Local model</option></select></label>
        <label>Endpoint<input id="profile-endpoint" type="url" autocomplete="off" spellcheck="false" placeholder="https://api.example.com/v1" required></label>
        <label>Model<input id="profile-model" autocomplete="off" spellcheck="false" placeholder="Model name" maxlength="150" required></label>
      </div>
      <p class="dialog-status"><span class="badge neutral">Draft configuration</span></p>
      <div class="dialog-actions"><button id="connection-cancel" type="button">Cancel</button><button class="primary" type="submit">Save draft</button></div>
    </form>
  </dialog>

  <template id="step-template">
    <li class="step">
      <span class="step-number" aria-hidden="true"></span>
      <div>
        <div class="step-top"><input class="step-title" maxlength="140"><div class="step-buttons"><button class="icon quiet move-up" aria-label="Move step up">↑</button><button class="icon quiet move-down" aria-label="Move step down">↓</button><button class="icon quiet danger remove-step" aria-label="Remove step">×</button></div></div>
        <div class="step-anchor" hidden></div>
        <div class="step-fields">
          <label class="date-label">Date<input class="step-date" type="date"></label>
          <label class="start-label">Start<input class="step-start" type="time"></label>
          <label class="end-label">End<input class="step-end" type="time"></label>
          <label class="step-field-wide rule-label" hidden><span class="rule-title"></span><input class="step-rule" maxlength="500" placeholder="Add requirement"></label>
        </div>
        <p class="step-status" role="status"></p>
      </div>
    </li>
  </template>
  <div class="live" id="announcer" aria-live="polite"></div>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const messages = {
      unscheduled:'Unscheduled', ready:'No field conflicts', missingName:'Name this step.', missingWindow:'Set the laying window.',
      missingIncubation:'Add an incubation timing rule.', missingL1:'Add L1 acceptance criteria.', missingL3:'Add L3 acceptance criteria.',
      missingLag:'Add the collection-to-dissection interval.', earlierEnd:'End must be later than start.', weekend:'Falls outside weekday availability.',
      invalidDate:'Set a valid date.', duplicateTarget:'Only one target step can follow the target fields.',
      missingCollection:'Set the collection date and time.', newStep:'New step', missingSource:'Select a source.',
      noTarget:'Target step removed.', sourceAfter:'Target precedes estimated source eclosion.'
    };
    let nextId = 0;
    const makeStep = (role, name, extra={}) => ({id:'step-'+(++nextId),role,name,date:'',start:'',end:'',rule:'',...extra});
    const defaultSteps = mode => mode === 'l1' ? [
      makeStep('adults','Select adults'), makeStep('laying','Egg laying'),makeStep('egg_collection','Collect eggs'),
      makeStep('incubation','Petri-dish incubation'), makeStep('assessment','Assess L1'),
      makeStep('target','L1 dissection',{date:$('target-date').value,start:$('target-start').value,end:$('target-end').value})
    ] : [
      makeStep('culture','Set up culture'),
      makeStep('assessment','Assess L3'),
      makeStep('collection','Collect L3 larvae',{date:$('target-date').value}),
      makeStep('target','L3 dissection',{date:$('target-date').value,start:$('target-start').value,end:$('target-end').value})
    ];
    const sourceRecords = {
      'bottle-a':{label:'Example bottle A',genotype:'w1118',setup:'2026-09-18',eclosion:'2026-09-28'},
      'vial-b':{label:'Example vial B',genotype:'elav-GAL4',setup:'2026-09-20',eclosion:'2026-09-30'}
    };
    const profiles = {cloud:{endpoint:'',model:''},local:{endpoint:'',model:''}};
    const stepDrafts = {};
    let mode = 'l1';
    let steps = defaultSteps(mode);
    let d5 = 5;
    let selectedProfile = 'cloud';
    let formProfile = 'cloud';
    let connectionDrafts;
    let checked = false;
    const dateLabel = value => value ? new Date(value+'T12:00:00').toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'}) : 'Date not set';
    const isDate = value => /^\d{4}-\d{2}-\d{2}$/.test(value) && Number.isFinite(Date.parse(value+'T12:00:00'));
    const isWeekend = value => isDate(value) && [0,6].includes(new Date(value+'T12:00:00').getDay());
    const shiftDate = (value,days) => {if(!isDate(value)) return '';const d = new Date(value+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);};
    function announce(message){$('announcer').textContent=message;}
    function invalidateCheck(){$('check-result').hidden=true;}
    function targetContext(){
      $('context-title').textContent=$('experiment-title').value || 'Untitled experiment';
      $('context-date').textContent=dateLabel($('target-date').value)+' · '+($('target-start').value || '—')+'–'+($('target-end').value || '—');
    }
    function synchronizeTarget(){
      for(const step of steps.filter(s=>s.role==='target')){
        step.date=$('target-date').value;step.start=$('target-start').value;step.end=$('target-end').value;
        const row=$(step.id);if(row){row.querySelector('.step-date').value=step.date;row.querySelector('.step-start').value=step.start;row.querySelector('.step-end').value=step.end;}
      }
      targetContext();updateDerivedCulture();validate();invalidateCheck();
    }
    function updateDerivedCulture(){
      if(mode!=='l3')return;
      const collection=steps.find(s=>s.role==='collection');
      for(const step of steps.filter(s=>s.role==='culture')){
        const existing=$('l3-material').value==='existing';
        step.date=existing ? (sourceRecords[$('source').value]?.setup || '') : Number.isFinite(d5) && d5>=0 && d5<=60 ? shiftDate(collection?.date || '',-d5) : '';
        const row=$(step.id);if(row){row.querySelector('.step-date').value=step.date;const anchor=row.querySelector('.step-anchor');const anchorMode=existing?'existing':'new';
          if(anchor.dataset.mode!==anchorMode){anchor.replaceChildren();anchor.dataset.mode=anchorMode;
            const text=document.createElement('span');text.textContent=existing?'Source setup':'Collection day';anchor.append(text);
            if(!existing){const input=document.createElement('input');input.type='number';input.min='0';input.max='60';input.value=Number.isFinite(d5)?String(d5):'';input.className='day-offset';input.setAttribute('aria-label','Culture day for L3 collection');input.addEventListener('input',()=>{d5=input.value===''?NaN:Number(input.value);updateDerivedCulture();validate();invalidateCheck();});anchor.append(input);}
          }
        }
      }
    }
    function materialContext(){
      const source=sourceRecords[$('source').value];
      let detail='';const warnings=[];
      if(source){
        detail=mode==='l1' && $('adult-source').value==='offspring' ? 'Estimated eclosion · '+dateLabel(source.eclosion) : 'Setup · '+dateLabel(source.setup);
        if(mode==='l1' && $('adult-source').value==='offspring' && $('target-date').value && $('target-date').value<source.eclosion)warnings.push(messages.sourceAfter);
        if($('target-genotype').value && $('target-genotype').value!==source.genotype)warnings.push('Source genotype differs from target.');
      }else if(checked)warnings.push(messages.missingSource);
      $('source-detail').textContent=detail;$('source-warning').textContent=warnings.join(' · ');
      $('adult-source-label').hidden=mode!=='l1';$('adult-count-label').hidden=mode!=='l1';$('l3-material-label').hidden=mode!=='l3';
    }
    function stepIssue(step,index){
      if(!step.name.trim())return {text:messages.missingName,type:'needs'};
      if(step.role==='culture' && (!Number.isInteger(d5) || d5<0 || d5>60))return {text:'Enter a culture day from 0 to 60.',type:'needs'};
      if(step.role==='target' && steps.filter(s=>s.role==='target').length>1)return {text:messages.duplicateTarget,type:'conflict'};
      if(step.date && !isDate(step.date))return {text:messages.invalidDate,type:'needs'};
      if(step.start && step.end && step.end<=step.start)return {text:messages.earlierEnd,type:'conflict'};
      const recordedCulture=step.role==='culture' && $('l3-material').value==='existing';
      if(!recordedCulture && $('weekdays-only').checked && isWeekend(step.date))return {text:messages.weekend,type:'conflict'};
      if(step.date && $('target-date').value && (step.date>$('target-date').value || (step.date===$('target-date').value && step.role!=='target' && step.start && $('target-start').value && step.start>$('target-start').value)))return {text:'Scheduled after the target start.',type:'conflict'};
      const previous=steps[index-1];
      if(previous && step.date && step.start && previous.date && (previous.end || previous.start) && (step.date+'T'+step.start)<(previous.date+'T'+(previous.end||previous.start)))return {text:'Starts before the preceding step finishes.',type:'conflict'};
      if(step.role==='laying' && (!step.date || !step.start || !step.end))return {text:messages.missingWindow,type:'needs'};
      if(step.role==='incubation' && !step.rule.trim())return {text:messages.missingIncubation,type:'needs'};
      if(step.role==='assessment' && !step.rule.trim())return {text:mode==='l1'?messages.missingL1:messages.missingL3,type:'needs'};
      if(step.role==='collection' && (!step.date || !step.start))return {text:messages.missingCollection,type:'needs'};
      if(step.role==='collection' && !step.rule.trim())return {text:messages.missingLag,type:'needs'};
      if(step.role==='collection' && $('l3-material').value==='existing' && Number.isInteger(d5) && d5>=0 && d5<=60){
        const source=sourceRecords[$('source').value];
        if(source && step.date!==shiftDate(source.setup,d5))return {text:'D'+d5+' from source setup · '+dateLabel(shiftDate(source.setup,d5)),type:'needs'};
      }
      if(!step.date || (step.role!=='culture' && !step.start))return {text:messages.unscheduled,type:'needs'};
      return {text:messages.ready,type:'neutral'};
    }
    function validate(){
      materialContext();
      let needs=0;let conflicts=0;
      steps.forEach((step,index)=>{const issue=stepIssue(step,index);if(issue.type==='needs')needs++;if(issue.type==='conflict')conflicts++;const row=$(step.id);if(row){const p=row.querySelector('.step-status');p.textContent=issue.text;p.className='step-status '+issue.type;p.hidden=issue.type==='neutral' || issue.text===messages.unscheduled || (issue.type==='needs' && !checked);
        row.querySelector('.step-title').setAttribute('aria-invalid',String(checked && !step.name.trim()));
        row.querySelector('.step-date').setAttribute('aria-invalid',String(checked && !step.date));
        row.querySelector('.step-start').setAttribute('aria-invalid',String(checked && step.role!=='culture' && !step.start));
        row.querySelector('.step-end').setAttribute('aria-invalid',String(checked && ['laying','target'].includes(step.role) && !step.end));
        row.querySelector('.step-rule').setAttribute('aria-invalid',String(checked && ['incubation','assessment','collection'].includes(step.role) && !step.rule.trim()));
      }});
      const targetErrors=[];
      if(!$('target-date').value || !$('target-start').value || !$('target-end').value)targetErrors.push('Complete the target date and time.');
      else if($('target-end').value<=$('target-start').value)targetErrors.push('Target end must be later than start.');
      if(!steps.some(s=>s.role==='target'))targetErrors.push(messages.noTarget);
      if(!$('target-genotype').value.trim())targetErrors.push('Enter the target genotype.');
      if(!$('target-quantity').value || Number($('target-quantity').value)<1)targetErrors.push('Enter the number of larvae needed.');
      const targetTimeConflict=$('target-start').value && $('target-end').value && $('target-end').value<=$('target-start').value;
      const warning=$('target-warning');warning.textContent=checked?targetErrors.join(' '):targetTimeConflict?'Target end must be later than start.':'';warning.hidden=!warning.textContent;
      needs+=targetErrors.length;
      if($('source-warning').textContent)needs++;
      for(const id of ['target-date','target-start','target-end','target-genotype','target-quantity'])$(id).setAttribute('aria-invalid',String(checked && !$(id).value));
      const badge=$('draft-state');badge.textContent=conflicts?conflicts+' conflict'+(conflicts===1?'':'s'):needs?needs+' open item'+(needs===1?'':'s'):'Fields complete';badge.className='badge '+(needs || conflicts?'amber':'neutral');
      badge.hidden=!checked && !conflicts;
      $('step-summary').textContent=steps.length+' steps';
      return {needs,conflicts};
    }
    function renderSteps(focusId){
      $('steps').replaceChildren();
      steps.forEach((step,index)=>{
        const row=$('step-template').content.firstElementChild.cloneNode(true);row.id=step.id;
        row.querySelector('.step-number').textContent=String(index+1);
        const title=row.querySelector('.step-title');title.value=step.name;title.setAttribute('aria-label','Step '+(index+1)+' name');
        title.addEventListener('input',()=>{step.name=title.value;up.setAttribute('aria-label','Move '+step.name+' up');down.setAttribute('aria-label','Move '+step.name+' down');if(step.role!=='target')remove.setAttribute('aria-label','Remove '+step.name);for(const key of ['date','start','end'])row.querySelector('.step-'+key).setAttribute('aria-label',step.name+' '+key);validate();invalidateCheck();});
        const up=row.querySelector('.move-up');const down=row.querySelector('.move-down');const remove=row.querySelector('.remove-step');
        up.disabled=index===0;down.disabled=index===steps.length-1;
        up.setAttribute('aria-label','Move '+step.name+' up');down.setAttribute('aria-label','Move '+step.name+' down');remove.setAttribute('aria-label','Remove '+step.name);
        if(step.role==='target'){remove.disabled=true;remove.setAttribute('aria-label','Target step cannot be removed');}
        function move(delta){const destination=index+delta;[steps[index],steps[destination]]=[steps[destination],steps[index]];renderSteps(step.id);invalidateCheck();announce('Step moved to position '+(destination+1));}
        up.addEventListener('click',()=>move(-1));down.addEventListener('click',()=>move(1));
        remove.addEventListener('click',()=>{steps=steps.filter(s=>s.id!==step.id);renderSteps(steps[Math.min(index,steps.length-1)]?.id);invalidateCheck();announce('Step removed');});
        for(const key of ['date','start','end']){
          const input=row.querySelector('.step-'+key);input.value=step[key];input.setAttribute('aria-label',step.name+' '+key);
          input.addEventListener('input',()=>{step[key]=input.value;if(step.role==='target'){$('target-'+key).value=input.value;targetContext();}updateDerivedCulture();validate();invalidateCheck();});
        }
        if(step.role==='culture'){
          row.querySelector('.step-date').readOnly=true;row.querySelector('.start-label').hidden=true;row.querySelector('.end-label').hidden=true;row.querySelector('.step-anchor').hidden=false;
        }
        const ruleTitle=step.role==='incubation'?'Incubation timing rule':step.role==='assessment'?'Acceptance criteria':step.role==='collection'?'Collection-to-dissection interval':'';
        if(ruleTitle){row.querySelector('.rule-label').hidden=false;row.querySelector('.rule-title').textContent=ruleTitle;const input=row.querySelector('.step-rule');input.value=step.rule;input.setAttribute('aria-label',ruleTitle);input.addEventListener('input',()=>{step.rule=input.value;validate();invalidateCheck();});}
        $('steps').append(row);
      });
      updateDerivedCulture();validate();if(focusId)$(focusId)?.querySelector('.step-title').focus();
    }
    function showAssistant(visible){$('assistant').hidden=!visible;$('layout').classList.toggle('assistant-hidden',!visible);$('assistant-toggle').setAttribute('aria-expanded',String(visible));if(!visible)$('assistant-toggle').focus();}
    $('assistant-toggle').addEventListener('click',()=>showAssistant($('assistant').hidden));
    $('assistant-close').addEventListener('click',()=>showAssistant(false));
    $('operation').addEventListener('change',()=>{
      stepDrafts[mode]=steps;mode=$('operation').value;steps=stepDrafts[mode] || defaultSteps(mode);checked=false;
      $('experiment-title').value=mode==='l1'?'L1 dissection':'L3 dissection';synchronizeTarget();renderSteps();invalidateCheck();
    });
    $('add-step').addEventListener('click',()=>{const step=makeStep('custom',messages.newStep);const targetIndex=steps.findIndex(s=>s.role==='target');steps.splice(targetIndex<0?steps.length:targetIndex,0,step);renderSteps(step.id);invalidateCheck();announce('Step added');});
    $('experiment-title').addEventListener('input',targetContext);
    ['target-date','target-start','target-end'].forEach(id=>$(id).addEventListener('input',synchronizeTarget));
    ['target-genotype','target-quantity','adult-count'].forEach(id=>$(id).addEventListener('input',()=>{validate();invalidateCheck();}));
    ['source','adult-source','l3-material','weekdays-only'].forEach(id=>$(id).addEventListener('change',()=>{updateDerivedCulture();validate();invalidateCheck();}));
    $('check-draft').addEventListener('click',()=>{checked=true;const {needs,conflicts}=validate();const result=$('check-result');result.hidden=false;result.className='result '+(needs || conflicts?'amber':'');result.textContent=conflicts?conflicts+' scheduling conflict'+(conflicts===1?'':'s')+' to resolve.':needs?needs+' open item'+(needs===1?'':'s')+' in this draft.':'Required fields are filled; no date-order conflicts found.';announce(result.textContent);});
    function readProfileFields(){connectionDrafts[formProfile]={endpoint:$('profile-endpoint').value,model:$('profile-model').value};}
    function fillProfileFields(){const profile=connectionDrafts[formProfile];$('profile-endpoint').value=profile.endpoint;$('profile-model').value=profile.model;$('profile-endpoint').placeholder=formProfile==='cloud'?'https://api.example.com/v1':'http://localhost:11434/v1';}
    $('connection-open').addEventListener('click',()=>{connectionDrafts={cloud:{...profiles.cloud},local:{...profiles.local}};formProfile=selectedProfile;$('profile-kind').value=formProfile;fillProfileFields();$('connection-dialog').showModal();});
    $('profile-kind').addEventListener('change',()=>{readProfileFields();formProfile=$('profile-kind').value;fillProfileFields();});
    ['connection-close','connection-cancel'].forEach(id=>$(id).addEventListener('click',()=>$('connection-dialog').close()));
    $('connection-form').addEventListener('submit',event=>{event.preventDefault();readProfileFields();profiles.cloud={...connectionDrafts.cloud};profiles.local={...connectionDrafts.local};selectedProfile=formProfile;$('profile-caption').textContent=(selectedProfile==='cloud'?'Cloud':'Local')+' · '+profiles[selectedProfile].model+' · Draft';$('connection-dialog').close();announce('Connection draft saved');});
    renderSteps();targetContext();if(matchMedia('(max-width:800px)').matches)showAssistant(false);
  </script>
</body>
</html>
